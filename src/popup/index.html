<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slop Radar</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="brand">
      <img class="brand__logo" src="../../public/icons/icon128.png" alt="" width="40" height="40" />
      <div>
        <h1>Slop Radar</h1>
        <p class="sub">Crypto-work feed for X</p>
      </div>
    </header>

    <section class="row toggles">
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span>Enabled</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="stampMode" />
        <span>Stamp mode</span>
      </label>
      <p class="hint">
        <strong>Off:</strong> slop is hidden immediately.<br />
        <strong>On:</strong> slop gets a stamp and stays visible.
      </p>
    </section>

    <section class="row toggles">
      <h2>Hide media with no text</h2>
      <label class="switch">
        <input type="checkbox" id="hideNoTextImage" />
        <span>No image</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="hideNoTextGif" />
        <span>No GIF</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="hideNoTextVideo" />
        <span>No video</span>
      </label>
    </section>

    <section>
      <h2>AI (OpenRouter)</h2>
      <label>
        Base URL
        <input id="apiBaseUrl" type="url" placeholder="https://openrouter.ai/api/v1" />
      </label>
      <label>
        API key
        <input id="apiKey" type="password" autocomplete="off" placeholder="sk-or-..." />
      </label>
      <div class="grid2">
        <label>
          Text model
          <input id="textModel" type="text" placeholder="google/gemini-2.5-flash-lite" />
        </label>
        <label>
          Vision model
          <input id="visionModel" type="text" placeholder="google/gemini-2.5-flash-lite" />
        </label>
      </div>
      <label>
        Strictness <span id="strictnessVal">0.5</span>
        <input id="strictness" type="range" min="0" max="1" step="0.05" />
      </label>
    </section>

    <section>
      <h2>Accounts</h2>
      <label>
        Allowlist (always keep)
        <textarea id="allowHandles" rows="3" placeholder="one handle per line"></textarea>
      </label>
      <label>
        Blocklist (always hide)
        <textarea id="blockHandles" rows="3" placeholder="one handle per line"></textarea>
      </label>
    </section>

    <section>
      <h2>Keywords</h2>
      <label>
        Keep (crypto / finance / cyber)
        <textarea id="cryptoKeywords" rows="4"></textarea>
      </label>
      <label>
        Slop (hide) — matches caption, quotes, and display name
        <textarea id="slopKeywords" rows="6"></textarea>
      </label>
      <button type="button" id="resetKeywordsBtn" class="ghost">Reset keywords to defaults</button>
    </section>

    <section class="stats">
      <h2>Session</h2>
      <div class="stat-grid">
        <div><strong id="statClassified">0</strong><span>classified</span></div>
        <div><strong id="statHidden">0</strong><span>hidden</span></div>
        <div><strong id="statAi">0</strong><span>AI calls</span></div>
        <div><strong id="statVision">0</strong><span>vision</span></div>
      </div>
      <div class="actions">
        <button type="button" id="undoBtn">Undo last hide</button>
        <button type="button" id="resetStatsBtn" class="ghost">Reset stats</button>
      </div>
    </section>

    <footer>
      <button type="button" id="saveBtn">Save</button>
      <button type="button" id="updateBtn" class="ghost" title="Apply latest keyword defaults and reload the extension">Update</button>
      <span id="status" role="status"></span>
      <span id="version" class="version"></span>
    </footer>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
